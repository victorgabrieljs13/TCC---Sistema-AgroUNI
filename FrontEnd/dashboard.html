<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroUNI — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="marca">A</div><span>AgroUNI</span></div>
        <nav class="sidebar-nav">
            <a href="produtos.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                <span>Produtos</span>
            </a>
            <a href="pedidos.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                <span>Pedidos</span>
            </a>
            <a href="movimentacao.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v14"/><path d="M3 13l4 4 4-4"/><path d="M17 21V7"/><path d="M21 11l-4-4-4 4"/></svg>
                <span>Movimentar</span>
            </a>
            <a href="dashboard.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
                <span>Dashboard</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <label class="theme-switch">Modo escuro
                <span class="switch"><input type="checkbox" class="theme-toggle"><span class="track"></span></span>
            </label>
            <div class="sidebar-user">
                <span id="nome-feirante"></span>
                <button id="btn-logout" title="Sair" aria-label="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </div>
        </div>
    </aside>

    <main class="app-main">
        <div class="page-head"><div><h1>Dashboard</h1><p class="page-sub">Visão geral do seu estoque.</p></div></div>

        <div class="stats-grid">
            <div class="stat-card"><span class="numero" id="card-total-produtos">—</span><span class="rotulo">Produtos cadastrados</span></div>
            <div class="stat-card alerta"><span class="numero" id="card-estoque-baixo">—</span><span class="rotulo">Com estoque baixo</span></div>
            <div class="stat-card"><span class="numero" id="card-valor-total">—</span><span class="rotulo">Valor total em estoque</span></div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <h3>Estoque atual por produto</h3>
            <canvas id="grafico-estoque" height="90"></canvas>
        </div>

        <div class="card">
            <h3>Variação de preço</h3>
            <div class="field" style="max-width: 280px;"><select class="input" id="select-produto-historico"></select></div>
            <p id="sem-historico" style="display:none; color: var(--text-muted); font-size: 13.5px;">Esse produto ainda não teve alteração de preço registrada.</p>
            <canvas id="grafico-precos" height="90"></canvas>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
