<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroUNI — Cadastro de Produto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="marca">A</div><span>AgroUNI</span></div>
        <nav class="sidebar-nav">
            <a href="produtos.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                <span>Produtos</span>
            </a>
            <a href="movimentacao.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v14"/><path d="M3 13l4 4 4-4"/><path d="M17 21V7"/><path d="M21 11l-4-4-4 4"/></svg>
                <span>Movimentar</span>
            </a>
            <a href="dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
                <span>Dashboard</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <label class="theme-switch">Modo escuro
                <span class="switch"><input type="checkbox" class="theme-toggle"><span class="track"></span></span>
            </label>
            <div class="sidebar-user">
                <span id="nome-feirante"></span>
                <button id="btn-logout" title="Sair" aria-label="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </div>
        </div>
    </aside>

    <main class="app-main">
        <div class="page-head">
            <div><h1 id="titulo-formulario">Novo produto</h1><p class="page-sub">Preencha os dados do produto.</p></div>
            <a href="produtos.html" class="btn btn-secondary">Voltar</a>
        </div>

        <div class="card card-form">
            <form id="form-produto">
                <div class="field"><label for="nome">Nome do produto</label><input class="input" type="text" id="nome" required></div>
                <div class="field"><label for="categoria">Categoria</label><input class="input" type="text" id="categoria" placeholder="Ex: Legume, Fruta, Verdura"></div>
                <div class="field">
                    <label for="unidade_medida">Unidade de medida</label>
                    <select class="input" id="unidade_medida" required>
                        <option value="">Selecione</option>
                        <option value="kg">Quilo (kg)</option>
                        <option value="unidade">Unidade</option>
                        <option value="caixa">Caixa</option>
                        <option value="duzia">Dúzia</option>
                    </select>
                </div>
                <div class="field"><label for="preco_atual">Preço (R$)</label><input class="input" type="number" id="preco_atual" step="0.01" min="0" required></div>
                <div class="field"><label for="quantidade_estoque">Quantidade em estoque</label><input class="input" type="number" id="quantidade_estoque" step="0.01" min="0" required></div>
                <div class="field"><label for="estoque_minimo">Estoque mínimo (para alerta)</label><input class="input" type="number" id="estoque_minimo" step="0.01" min="0" required></div>
                <div class="field">
                    <label for="status">Status</label>
                    <select class="input" id="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar produto</button>
            </form>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/cadastroProduto.js"></script>
</body>
</html>
