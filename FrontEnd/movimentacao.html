<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroUNI — Movimentar Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand"><div class="marca">A</div><span>AgroUNI</span></div>
        <nav class="sidebar-nav">
            <a href="produtos.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
                <span>Produtos</span>
            </a>
            <a href="pedidos.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
                <span>Pedidos</span>
            </a>
            <a href="movimentacao.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v14"/><path d="M3 13l4 4 4-4"/><path d="M17 21V7"/><path d="M21 11l-4-4-4 4"/></svg>
                <span>Movimentar</span>
            </a>
            <a href="dashboard.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
                <span>Dashboard</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <label class="theme-switch">Modo escuro
                <span class="switch"><input type="checkbox" class="theme-toggle"><span class="track"></span></span>
            </label>
            <div class="sidebar-user">
                <span id="nome-feirante"></span>
                <button id="btn-logout" title="Sair" aria-label="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </div>
        </div>
    </aside>

    <main class="app-main">
        <div class="page-head">
            <div><h1>Movimentar estoque</h1><p class="page-sub">Registre uma entrada ou saída de produto.</p></div>
            <a href="produtos.html" class="btn btn-secondary">Voltar</a>
        </div>

        <div class="card card-form">
            <form id="form-movimentacao">
                <div class="field">
                    <label for="produto_id">Produto</label>
                    <select class="input" id="produto_id" required><option value="">Selecione um produto</option></select>
                </div>
                <div class="field">
                    <label for="tipo">Tipo de movimentação</label>
                    <select class="input" id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="entrada">Entrada (reposição)</option>
                        <option value="saida">Saída (venda/perda)</option>
                    </select>
                </div>
                <div class="field"><label for="quantidade">Quantidade</label><input class="input" type="number" id="quantidade" step="0.01" min="0.01" required></div>
                <div class="field"><label for="motivo">Motivo (opcional)</label><input class="input" type="text" id="motivo" placeholder="Ex: Venda no balcão, Reposição semanal"></div>
                <button type="submit" class="btn btn-primary" id="btn-registrar">Registrar movimentação</button>
            </form>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/movimentacao.js"></script>
</body>
</html>
