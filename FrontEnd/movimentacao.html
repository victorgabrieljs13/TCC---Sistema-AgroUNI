<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroUNI - Movimentação de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <h1>AgroUNI</h1>
        <div class="topo-usuario">
            <span id="nome-feirante"></span>
            <button id="btn-logout">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <a href="produtos.html" class="acao-link">&larr; Voltar para produtos</a>

        <div class="container" style="margin-top: 20px;">
            <h2>Movimentar Estoque</h2>

            <form id="form-movimentacao">
                <label for="produto_id">Produto</label>
                <select id="produto_id" required>
                    <option value="">Selecione um produto</option>
                    <!-- Preenchido via JavaScript -->
                </select>

                <label for="tipo">Tipo de movimentação</label>
                <select id="tipo" required>
                    <option value="">Selecione</option>
                    <option value="entrada">Entrada (reposição)</option>
                    <option value="saida">Saída (venda/perda)</option>
                </select>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" step="0.01" min="0.01" required>

                <label for="motivo">Motivo (opcional)</label>
                <input type="text" id="motivo" placeholder="Ex: Venda no balcão, Reposição semanal">

                <button type="submit">Registrar Movimentação</button>

                <div class="mensagem-erro" id="mensagem-erro"></div>
                <div class="mensagem-sucesso" id="mensagem-sucesso"></div>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/movimentacao.js"></script>
</body>
</html>
