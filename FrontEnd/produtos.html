<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroUNI - Meus Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <h1>AgroUNI</h1>
        <div class="topo-usuario">
            <span id="nome-feirante"></span>
            <button id="btn-logout">Sair</button>
        </div>
    </header>

    <main class="conteudo">
        <div class="acoes-topo">
            <h2>Meus Produtos</h2>
            <div>
                <a href="dashboard.html" class="botao botao-secundario">Dashboard</a>
                <a href="movimentacao.html" class="botao botao-secundario">Movimentar Estoque</a>
                <a href="cadastro-produto.html" class="botao botao-primario">+ Novo Produto</a>
</div>
        </div>

        <div class="mensagem-erro" id="mensagem-erro"></div>

        <table class="tabela-produtos" id="tabela-produtos">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>

        <p id="lista-vazia" style="display: none;">Você ainda não cadastrou nenhum produto.</p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
