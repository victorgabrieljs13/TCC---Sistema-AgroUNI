<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — AgroUNI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/vitrine.css">
</head>
<body>

  <div class="vt-auth-shell">
    <div class="vt-auth-card">
      <h1>Criar conta</h1>
      <p class="vt-auth-sub">Guarda seu histórico de pedidos e pula a digitação na próxima reserva.</p>

      <form id="form-cadastro-consumidor" class="vt-form-reserva">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" required minlength="6">

        <label for="telefone">Telefone (WhatsApp)</label>
        <input type="tel" id="telefone" required placeholder="(71) 9 9999-9999">

        <button type="submit" class="vt-botao-enviar" id="btn-cadastrar">Criar conta</button>

        <div class="vt-auth-erro" id="mensagem-erro"></div>
      </form>

      <p class="vt-auth-rodape">Já tem conta? <a href="login-consumidor.html">Entrar</a></p>
      <p class="vt-auth-rodape"><a href="vitrine.html">&larr; Continuar sem conta</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/consumidor.js"></script>
</body>
</html>
